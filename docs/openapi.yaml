openapi: 3.0.3
info:
  title: Marketplace API
  version: 1.0.0
  description: REST API for marketplace accounts, listings, social features, and access control.
servers:
  - url: http://localhost:8081/api/v1
x-websocket:
  url: ws://localhost:8081/ws/notifications?token={jwt}
  description: >-
    Realtime push for notifications and chat messages. Events are JSON text frames emitted
    after the database transaction commits. Events: connected, notification.created,
    notification.read, notification.read-all, message.created (sent to both chat participants
    and carrying the same message fields as a conversation item).
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      security: []
      summary: Register and sign in a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseAuth' }
  /auth/login:
    post:
      security: []
      summary: Log in with email or username
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: JWT issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseAuth' }
  /auth/change-password:
    post:
      summary: Change the current account password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200': { description: Password changed; the existing token stays valid }
        '400': { description: Current password incorrect, new password too short, or unchanged }
  /users/me:
    get:
      summary: Current account
      responses:
        '200': { description: Account response }
    patch:
      summary: Update current profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200': { description: 'Updated account plus a replacement token when the email changed' }
  /users/me/permissions:
    get:
      summary: Current user's effective permissions
      responses:
        '200': { description: Permission names }
  /users/{id}:
    get:
      summary: Public user profile
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: User profile }
  /users/{id}/reviews:
    get:
      summary: Seller reviews
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses:
        '200': { description: Paged reviews }
  /products:
    get:
      security: []
      summary: Browse and filter products
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: location, in: query, schema: { type: string } }
        - { name: condition, in: query, schema: { $ref: '#/components/schemas/ConditionType' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ProductStatus' } }
        - { name: minPrice, in: query, schema: { type: number, format: double } }
        - { name: maxPrice, in: query, schema: { type: number, format: double } }
        - { name: sellerId, in: query, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200': { description: Paged products }
    post:
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProductRequest' }
      responses:
        '201': { description: Product created }
  /products/{id}:
    get:
      security: []
      summary: Product details
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Product }
    patch:
      summary: Update own product
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProductRequest' }
      responses:
        '200': { description: Updated product }
    delete:
      summary: Soft-delete own product
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Product deleted }
  /products/{id}/status:
    patch:
      summary: Change own product status
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateStatusRequest' }
      responses:
        '200': { description: Product status updated }
  /products/{id}/images:
    get:
      security: []
      summary: List product images
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Images }
    post:
      summary: Upload product image
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201': { description: Image uploaded }
  /uploads/{filename}:
    get:
      security: []
      summary: Retrieve an uploaded image
      parameters:
        - { name: filename, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Image bytes }
  /products/{id}/images/{imageId}/primary:
    patch:
      summary: Select primary product image
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: imageId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Primary image updated }
  /products/{id}/images/{imageId}:
    delete:
      summary: Delete product image
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: imageId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Image deleted }
  /products/{id}/reviews:
    get:
      security: []
      summary: List product reviews
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses:
        '200': { description: Paged reviews }
    post:
      summary: Review a product once
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddReviewRequest' }
      responses:
        '201': { description: Review created }
  /reviews/{id}:
    delete:
      summary: Delete own review
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Review deleted }
  /wishlist:
    get:
      summary: List current user's wishlist
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses:
        '200': { description: Paged products }
  /wishlist/{productId}:
    put:
      summary: Add a product to wishlist
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '200': { description: Wishlist entry }
    delete:
      summary: Remove a product from wishlist
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '200': { description: Wishlist entry removed }
  /posts:
    get:
      security: []
      summary: List posts
      parameters:
        - { name: userId, in: query, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200': { description: Paged posts }
    post:
      summary: Create post from own product listings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePostRequest' }
      responses:
        '201': { description: Post created }
  /posts/{id}:
    get:
      security: []
      summary: Post details
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Post with linked products and reaction count }
    put:
      summary: Update own post
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePostRequest' }
      responses:
        '200': { description: Updated post }
    delete:
      summary: Soft-delete own post
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Post deleted }
  /posts/{id}/reaction:
    put:
      summary: Add or replace own reaction
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReactionRequest' }
      responses:
        '200': { description: Reaction }
    delete:
      summary: Remove own reaction
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Reaction removed }
  /posts/{id}/comments:
    get:
      security: []
      summary: List comments
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses:
        '200': { description: Paged comments }
    post:
      summary: Comment on a post
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentRequest' }
      responses:
        '201': { description: Comment created }
  /comments/{id}:
    patch:
      summary: Update own comment
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentRequest' }
      responses:
        '200': { description: Updated comment }
    delete:
      summary: Soft-delete own comment
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Comment deleted }
  /friends:
    get:
      summary: List accepted friendships
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses:
        '200': { description: Paged friendships }
  /friends/requests:
    get:
      summary: List incoming pending requests
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses:
        '200': { description: Paged friendships }
  /friends/requests/{userId}:
    post:
      summary: Send a friend request
      parameters: [{ name: userId, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '201': { description: Friend request }
  /friends/requests/{id}/accept:
    patch:
      summary: Accept incoming request
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Accepted friendship }
  /friends/requests/{id}/decline:
    patch:
      summary: Decline incoming request
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Declined request }
  /friends/{id}:
    delete:
      summary: Remove friendship or request
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Friendship removed }
  /messages:
    get:
      summary: List latest message for each conversation
      responses:
        '200': { description: Message array }
  /messages/{userId}:
    get:
      summary: Get conversation with user
      parameters: [{ name: userId, in: path, required: true, schema: { type: integer, format: int64 } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses:
        '200': { description: Paged messages }
    post:
      summary: Send message to user
      parameters: [{ name: userId, in: path, required: true, schema: { type: integer, format: int64 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageRequest' }
      responses:
        '201': { description: Message sent }
  /messages/{userId}/read:
    patch:
      summary: Mark incoming messages in conversation as read
      parameters: [{ name: userId, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '200': { description: Conversation read }
  /notifications:
    get:
      summary: List current user's notifications
      description: >-
        Listing-post notifications are staff-only; every other type is visible to its recipient.
        COMMENT notifications contain the comment body and reply notifications target the parent
        comment author; MESSAGE notifications contain the chat text. Timestamps are UTC with a
        trailing Z.
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses:
        '200':
          description: Paged notifications
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponsePageNotification' }
  /notifications/unread-count:
    get:
      summary: Unread notification count for the current user
      responses:
        '200':
          description: Count
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseUnreadCount' }
  /notifications/{id}/read:
    patch:
      summary: Mark own notification read
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Updated notification }
  /notifications/read-all:
    patch:
      summary: Mark all own notifications read
      responses:
        '200': { description: Notifications marked read }
  /admin/users:
    get:
      summary: List accounts (user:manage)
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses:
        '200': { description: Paged accounts }
  /admin/users/{id}:
    get:
      summary: Read account (user:manage)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Account }
  /admin/users/{id}/active:
    patch:
      summary: Activate or deactivate an account (user:manage)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActiveRequest' }
      responses:
        '200': { description: Updated account }
  /admin/roles:
    get:
      summary: List roles
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses:
        '200': { description: Paged roles }
    post:
      summary: Create role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleRequest' }
      responses:
        '201': { description: Role created }
  /admin/roles/{id}:
    get:
      summary: Read role
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Role }
    put:
      summary: Update role
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleRequest' }
      responses:
        '200': { description: Updated role }
    delete:
      summary: Delete non-built-in, unassigned role
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Role deleted }
  /admin/roles/{id}/permissions:
    get:
      summary: List role permissions
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Permission array }
    put:
      summary: Replace role permission assignments
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdSetRequest' }
      responses:
        '200': { description: Updated role }
  /admin/roles/{id}/permissions/{permissionId}:
    put:
      summary: Add a permission to a role
      parameters: [{ $ref: '#/components/parameters/Id' }, { name: permissionId, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '200': { description: Updated role }
    delete:
      summary: Remove a permission from a role
      parameters: [{ $ref: '#/components/parameters/Id' }, { name: permissionId, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '200': { description: Updated role }
  /admin/permissions:
    get:
      summary: List permissions
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses:
        '200': { description: Paged permissions }
    post:
      summary: Create permission
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionRequest' }
      responses:
        '201': { description: Permission created }
  /admin/permissions/{id}:
    get:
      summary: Read permission
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Permission }
    put:
      summary: Update permission
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionRequest' }
      responses:
        '200': { description: Updated permission }
    delete:
      summary: Delete unassigned permission
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Permission deleted }
  /admin/users/{id}/roles:
    get:
      summary: List user's roles
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Role array }
    put:
      summary: Replace user's roles
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdSetRequest' }
      responses:
        '200': { description: Updated account }
  /admin/users/{id}/permissions:
    get:
      summary: List user's effective permissions
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Permission names }
  /admin/users/{id}/roles/{roleId}:
    put:
      summary: Add role to user
      parameters: [{ $ref: '#/components/parameters/Id' }, { name: roleId, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '200': { description: Updated account }
    delete:
      summary: Remove role from user
      parameters: [{ $ref: '#/components/parameters/Id' }, { name: roleId, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '200': { description: Updated account }
  /payroll/employees:
    get:
      summary: List employee payroll profiles (payroll:read)
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/EmploymentStatus' } }
        - { name: department, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200': { description: Paged employee profiles }
    post:
      summary: Enroll a staff user in payroll (payroll:manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollEmployeeRequest' }
      responses:
        '201': { description: Employee profile }
  /payroll/employees/{userId}:
    get:
      summary: Read an employee payroll profile (payroll:read)
      parameters: [{ name: userId, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '200': { description: Employee profile }
    put:
      summary: Update compensation (payroll:manage)
      parameters: [{ name: userId, in: path, required: true, schema: { type: integer, format: int64 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEmployeeRequest' }
      responses:
        '200': { description: Updated employee profile }
  /payroll/employees/{userId}/status:
    patch:
      summary: Set employment status (payroll:manage)
      parameters: [{ name: userId, in: path, required: true, schema: { type: integer, format: int64 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEmploymentStatusRequest' }
      responses:
        '200': { description: Updated employee profile }
  /payroll/runs:
    get:
      summary: List payroll runs (payroll:read)
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses:
        '200': { description: Paged payroll runs }
    post:
      summary: Create a payroll run and generate payslips (payroll:manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePayrollRunRequest' }
      responses:
        '201': { description: Payroll run }
  /payroll/runs/{id}:
    get:
      summary: Read a payroll run (payroll:read)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Payroll run }
  /payroll/runs/{id}/regenerate:
    post:
      summary: Regenerate draft payslips from current profiles (payroll:manage)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Payroll run }
  /payroll/runs/{id}/payslips:
    get:
      summary: List payslips for a run (payroll:read)
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses:
        '200': { description: Paged payslips }
  /payroll/runs/{id}/approve:
    post:
      summary: Approve a draft payroll run (payroll:approve)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Payroll run }
  /payroll/runs/{id}/pay:
    post:
      summary: Mark an approved payroll run paid (payroll:approve)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Payroll run }
  /payroll/runs/{id}/cancel:
    post:
      summary: Cancel a draft payroll run (payroll:manage)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Payroll run }
  /payroll/payslips/{id}:
    get:
      summary: Read any payslip (payroll:read)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Payslip }
    patch:
      summary: Adjust a draft payslip (payroll:manage)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePayslipRequest' }
      responses:
        '200': { description: Payslip }
  /payroll/me/profile:
    get:
      summary: Read own employee profile
      responses:
        '200': { description: Employee profile }
  /payroll/me/payslips:
    get:
      summary: List own approved or paid payslips
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Size' }]
      responses:
        '200': { description: Paged payslips }
  /payroll/me/payslips/{id}:
    get:
      summary: Read own approved or paid payslip
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Payslip }
  /reports/overview:
    get:
      summary: Platform KPI totals (report:read)
      responses:
        '200':
          description: Overview totals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportOverview' }
  /reports/product-status:
    get:
      summary: Listings grouped by status (report:read)
      responses:
        '200':
          description: Status breakdown
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductStatusReport' }
  /reports/categories:
    get:
      summary: Top categories with availability and value (report:read)
      responses:
        '200':
          description: Category performance
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CategoryReport' }
  /reports/monthly-activity:
    get:
      summary: Monthly users, listings, posts, comments and reactions (report:read)
      parameters:
        - name: months
          in: query
          schema: { type: integer, minimum: 1, maximum: 24, default: 12 }
      responses:
        '200':
          description: Monthly activity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MonthlyActivityReport' }
  /reports/engagement:
    get:
      summary: Monthly comments, reactions, wishlists, reviews and messages (report:read)
      parameters:
        - name: months
          in: query
          schema: { type: integer, minimum: 1, maximum: 24, default: 12 }
      responses:
        '200':
          description: Monthly engagement
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EngagementReport' }
  /reports/top-sellers:
    get:
      summary: Sellers ranked by listings and sold revenue (report:read)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 8 }
      responses:
        '200':
          description: Seller leaderboard
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TopSellerReport' }
  /reports/payroll/departments:
    get:
      summary: Latest approved payroll run by department (report:read)
      responses:
        '200':
          description: Department payroll
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PayrollDepartmentReport' }
  /reports/payroll/runs:
    get:
      summary: Recent payroll runs with totals (report:read)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 36, default: 12 }
      responses:
        '200':
          description: Payroll runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PayrollRunReport' }
  /reports/payroll/headcount:
    get:
      summary: Headcount per department by employment status (report:read)
      responses:
        '200':
          description: Headcount
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HeadcountReport' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  schemas:
    ApiResponseAuth:
      type: object
      properties:
        status: { type: integer }
        message: { type: string }
        data: { $ref: '#/components/schemas/AuthResponse' }
        timestamp: { type: string, format: date-time }
    AuthResponse:
      type: object
      required: [token]
      properties:
        token: { type: string }
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 50 }
        email: { type: string, format: email, maxLength: 100 }
        password: { type: string, minLength: 8, maxLength: 72 }
        fullName: { type: string, maxLength: 100 }
    LoginRequest:
      type: object
      required: [password]
      properties:
        email: { type: string, format: email }
        username: { type: string }
        password: { type: string }
      description: Supply either email or username with password.
    UpdateProfileRequest:
      type: object
      properties:
        firstName: { type: string, maxLength: 50 }
        lastName: { type: string, maxLength: 50 }
        fullName: { type: string, maxLength: 100, description: Legacy alternative to firstName/lastName. }
        email: { type: string, format: email, maxLength: 100 }
        location: { type: string, maxLength: 100 }
        phone: { type: string, maxLength: 20 }
        bio: { type: string }
    CreateProductRequest:
      type: object
      required: [title, price]
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string }
        price: { type: number, minimum: 0, exclusiveMinimum: true, multipleOf: 0.01 }
        category: { type: string, maxLength: 100 }
        location: { type: string, maxLength: 100 }
        condition: { $ref: '#/components/schemas/ConditionType' }
    UpdateProductRequest:
      type: object
      description: All fields are optional; send only fields to update.
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, nullable: true }
        price: { type: number, minimum: 0.01, multipleOf: 0.01 }
        category: { type: string, maxLength: 100, nullable: true }
        location: { type: string, maxLength: 100, nullable: true }
        condition: { $ref: '#/components/schemas/ConditionType' }
    UpdateStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ProductStatus' }
    AddReviewRequest:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
    CreatePostRequest:
      type: object
      required: [productIds]
      properties:
        content: { type: string }
        productIds:
          type: array
          minItems: 1
          items: { type: integer, format: int64 }
    ReactionRequest:
      type: object
      required: [reactionType]
      properties:
        reactionType: { type: string, enum: [LIKE, LOVE, HAHA, WOW, SAD, ANGRY] }
    CommentRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1 }
    MessageRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1 }
        productId: { type: integer, format: int64, nullable: true }
    ActiveRequest:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
    IdSetRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          uniqueItems: true
          items: { type: integer, format: int64, minimum: 1 }
    RoleRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, pattern: '^ROLE_[A-Z][A-Z0-9_]*$', maxLength: 50 }
        description: { type: string, maxLength: 200 }
    PermissionRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, pattern: '^[a-z][a-z0-9_-]*:[a-z][a-z0-9_-]*$', maxLength: 100 }
        description: { type: string, maxLength: 200 }
    ConditionType:
      type: string
      enum: [NEW, LIKE_NEW, GOOD, FAIR, POOR]
    ProductStatus:
      type: string
      enum: [AVAILABLE, SOLD, RESERVED, DELETED]
    UserResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        fullName: { type: string, nullable: true }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        bio: { type: string, nullable: true }
        location: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    AccountResponse:
      type: object
      properties:
        profile: { $ref: '#/components/schemas/UserResponse' }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        active: { type: boolean }
        roles: { type: array, items: { type: string } }
    Product:
      type: object
      properties:
        id: { type: integer, format: int64 }
        sellerId: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string, nullable: true }
        price: { type: number, multipleOf: 0.01 }
        category: { type: string, nullable: true }
        condition: { $ref: '#/components/schemas/ConditionType' }
        location: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ProductStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProductImage:
      type: object
      properties:
        id: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        imageUrl: { type: string }
        isPrimary: { type: boolean }
        createdAt: { type: string, format: date-time }
    Review:
      type: object
      properties:
        id: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        buyerId: { type: integer, format: int64 }
        sellerId: { type: integer, format: int64 }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    ListingPost:
      type: object
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        content: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PostResponse:
      type: object
      properties:
        post: { $ref: '#/components/schemas/ListingPost' }
        products: { type: array, items: { $ref: '#/components/schemas/Product' } }
        reactionCount: { type: integer, format: int64 }
    Comment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        postId: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        content: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Friendship:
      type: object
      properties:
        id: { type: integer, format: int64 }
        requesterId: { type: integer, format: int64 }
        addresseeId: { type: integer, format: int64 }
        status: { type: string, enum: [PENDING, ACCEPTED, DECLINED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Message:
      type: object
      description: Chat message with both participant profiles so lists and conversations can render names and avatars.
      properties:
        id: { type: integer, format: int64 }
        senderId: { type: integer, format: int64 }
        receiverId: { type: integer, format: int64 }
        productId: { type: integer, format: int64, nullable: true }
        content: { type: string }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }
        sender: { $ref: '#/components/schemas/UserResponse' }
        receiver: { $ref: '#/components/schemas/UserResponse' }
    Notification:
      type: object
      description: >-
        `message` carries the event text: the comment body for COMMENT (a reply notifies the
        parent comment author), the chat text for MESSAGE, and the listing content for POST.
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, enum: [COMMENT, MESSAGE, FRIEND_REQUEST, REVIEW, LIKE, PAYROLL, POST, PASSWORD_CHANGE] }
        message: { type: string }
        refId: { type: integer, format: int64, nullable: true }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time, description: 'UTC wall-clock time serialized with a trailing Z.' }
        itemCount: { type: integer }
        postId: { type: integer, format: int64, nullable: true }
        productId: { type: integer, format: int64, nullable: true }
        actor: { $ref: '#/components/schemas/UserResponse' }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8, maxLength: 72 }
    ApiResponseUnreadCount:
      type: object
      properties:
        status: { type: integer }
        message: { type: string }
        data:
          type: object
          properties:
            count: { type: integer, format: int64 }
        timestamp: { type: string, format: date-time }
    ApiResponsePageNotification:
      type: object
      properties:
        status: { type: integer }
        message: { type: string }
        data:
          allOf:
            - $ref: '#/components/schemas/Page'
            - type: object
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/Notification' }
        timestamp: { type: string, format: date-time }
    Permission:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string, nullable: true }
    Role:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string, nullable: true }
        permissions: { type: array, items: { $ref: '#/components/schemas/Permission' } }
    EmploymentStatus:
      type: string
      enum: [ACTIVE, ON_LEAVE, TERMINATED]
    PayrollRunStatus:
      type: string
      enum: [DRAFT, APPROVED, PAID, CANCELLED]
    EnrollEmployeeRequest:
      type: object
      required: [userId, baseSalary]
      properties:
        userId: { type: integer, format: int64 }
        employeeCode: { type: string, maxLength: 30 }
        jobTitle: { type: string, maxLength: 100 }
        department: { type: string, maxLength: 100 }
        baseSalary: { type: number, minimum: 0, multipleOf: 0.01 }
        allowance: { type: number, minimum: 0, multipleOf: 0.01 }
        currency: { type: string, pattern: '^[A-Za-z]{3}$' }
        hireDate: { type: string, format: date }
        bankName: { type: string, maxLength: 100 }
        bankAccount: { type: string, maxLength: 50 }
    UpdateEmployeeRequest:
      type: object
      required: [baseSalary]
      properties:
        jobTitle: { type: string, maxLength: 100 }
        department: { type: string, maxLength: 100 }
        baseSalary: { type: number, minimum: 0, multipleOf: 0.01 }
        allowance: { type: number, minimum: 0, multipleOf: 0.01 }
        currency: { type: string, pattern: '^[A-Za-z]{3}$' }
        hireDate: { type: string, format: date }
        bankName: { type: string, maxLength: 100 }
        bankAccount: { type: string, maxLength: 50 }
    UpdateEmploymentStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/EmploymentStatus' }
    CreatePayrollRunRequest:
      type: object
      required: [year, month]
      properties:
        year: { type: integer, minimum: 2000, maximum: 2100 }
        month: { type: integer, minimum: 1, maximum: 12 }
        currency: { type: string, pattern: '^[A-Za-z]{3}$' }
        notes: { type: string, maxLength: 500 }
    UpdatePayslipRequest:
      type: object
      properties:
        bonus: { type: number, minimum: 0, multipleOf: 0.01 }
        overtime: { type: number, minimum: 0, multipleOf: 0.01 }
        tax: { type: number, minimum: 0, multipleOf: 0.01 }
        otherDeductions: { type: number, minimum: 0, multipleOf: 0.01 }
        notes: { type: string, maxLength: 500 }
    EmployeeProfileResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        username: { type: string, nullable: true }
        fullName: { type: string, nullable: true }
        employeeCode: { type: string }
        jobTitle: { type: string, nullable: true }
        department: { type: string, nullable: true }
        baseSalary: { type: number }
        allowance: { type: number }
        currency: { type: string }
        hireDate: { type: string, format: date, nullable: true }
        bankName: { type: string, nullable: true }
        bankAccount: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/EmploymentStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PayrollRunResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        periodYear: { type: integer }
        periodMonth: { type: integer }
        currency: { type: string }
        status: { $ref: '#/components/schemas/PayrollRunStatus' }
        notes: { type: string, nullable: true }
        totalGross: { type: number }
        totalDeductions: { type: number }
        totalNet: { type: number }
        createdBy: { type: integer, format: int64 }
        approvedBy: { type: integer, format: int64, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }
        paidAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PayslipResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        runId: { type: integer, format: int64 }
        periodYear: { type: integer, nullable: true }
        periodMonth: { type: integer, nullable: true }
        runStatus: { type: string, enum: [DRAFT, APPROVED, PAID, CANCELLED], nullable: true }
        userId: { type: integer, format: int64 }
        employeeCode: { type: string }
        employeeName: { type: string }
        jobTitle: { type: string, nullable: true }
        department: { type: string, nullable: true }
        baseSalary: { type: number }
        allowance: { type: number }
        bonus: { type: number }
        overtime: { type: number }
        tax: { type: number }
        otherDeductions: { type: number }
        grossPay: { type: number }
        deductionsTotal: { type: number }
        netPay: { type: number }
        currency: { type: string }
        notes: { type: string, nullable: true }
        paidAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReportOverview:
      type: object
      properties:
        totalUsers: { type: integer, format: int64 }
        activeUsers: { type: integer, format: int64 }
        sellers: { type: integer, format: int64 }
        products: { type: integer, format: int64 }
        availableProducts: { type: integer, format: int64 }
        soldProducts: { type: integer, format: int64 }
        posts: { type: integer, format: int64 }
        comments: { type: integer, format: int64 }
        reactions: { type: integer, format: int64 }
        wishlists: { type: integer, format: int64 }
        employees: { type: integer, format: int64 }
        activeEmployees: { type: integer, format: int64 }
        paidGross: { type: number }
        paidNet: { type: number }
        availableValue: { type: number }
    ProductStatusReport:
      type: object
      properties:
        status: { type: string, enum: [AVAILABLE, SOLD, RESERVED, DELETED] }
        products: { type: integer, format: int64 }
        value: { type: number }
    CategoryReport:
      type: object
      properties:
        category: { type: string }
        products: { type: integer, format: int64 }
        available: { type: integer, format: int64 }
        sold: { type: integer, format: int64 }
        reserved: { type: integer, format: int64 }
        value: { type: number }
    MonthlyActivityReport:
      type: object
      properties:
        month: { type: string, example: '2026-10' }
        users: { type: integer, format: int64 }
        products: { type: integer, format: int64 }
        posts: { type: integer, format: int64 }
        comments: { type: integer, format: int64 }
        reactions: { type: integer, format: int64 }
    EngagementReport:
      type: object
      properties:
        month: { type: string, example: '2026-10' }
        comments: { type: integer, format: int64 }
        reactions: { type: integer, format: int64 }
        wishlists: { type: integer, format: int64 }
        reviews: { type: integer, format: int64 }
        messages: { type: integer, format: int64 }
    TopSellerReport:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        name: { type: string }
        listings: { type: integer, format: int64 }
        sold: { type: integer, format: int64 }
        revenue: { type: number }
        reactions: { type: integer, format: int64 }
        comments: { type: integer, format: int64 }
    PayrollDepartmentReport:
      type: object
      properties:
        periodYear: { type: integer }
        periodMonth: { type: integer }
        department: { type: string }
        employees: { type: integer, format: int64 }
        gross: { type: number }
        deductions: { type: number }
        net: { type: number }
    PayrollRunReport:
      type: object
      properties:
        periodYear: { type: integer }
        periodMonth: { type: integer }
        status: { type: string, enum: [DRAFT, APPROVED, PAID, CANCELLED] }
        employees: { type: integer, format: int64 }
        gross: { type: number }
        deductions: { type: number }
        net: { type: number }
    HeadcountReport:
      type: object
      properties:
        department: { type: string }
        active: { type: integer, format: int64 }
        onLeave: { type: integer, format: int64 }
        terminated: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
